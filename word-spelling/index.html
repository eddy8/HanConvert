<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

      name="description"
      content="免费英语单词拼写练习网站，听发音、摆字母，边听边写记单词。覆盖小学一年级到初中词库，支持中文释义朗读、字母闯关、错题回顾，适合课后听写和背单词打卡。"
    />
    <meta name="keywords" content="英语单词拼写,英语听写,背单词,小学英语听写,单词拼写练习,字母拼写,在线听写工具" />
    <link rel="canonical" href="https://jianfan.app/word-spelling/" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="英语单词拼写练习 - 免费在线听写背单词工具" />
    <meta
      property="og:description"
      content="听发音、摆字母，边听边写记单词。覆盖小学到初中词库，支持中文释义朗读和字母闯关模式。"
    />
    <meta property="og:url" content="https://jianfan.app/word-spelling/" />
    <meta property="og:locale" content="zh_CN" />
    <link rel="stylesheet" href="styles.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalApplication",
        "name": "英语单词拼写练习",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web",
        "description": "免费在线英语单词拼写与听写练习工具，支持字母闯关、发音朗读与中文释义，覆盖小学到初中词库。",
        "inLanguage": "zh-CN",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "CNY"
        }
      }
    </script>
  </head>
  <body>
    <main class="app-shell">
      <section class="practice-panel" aria-labelledby="page-title">
        <div class="top-bar">
          <div>
            <p class="eyebrow">English Spelling Lab</p>
            <h1 id="page-title">英语单词拼写练习 · 字母闯关</h1>
            <p class="page-subtitle">听发音、记字母、摆单词——从小学到初中词库，免费在线练拼写、练听写。</p>
          </div>
          <div class="round-meter" aria-live="polite">
            <span id="current-index">1</span>
            <span class="meter-divider">/</span>
            <span id="round-total">30</span>
          </div>
        </div>

        <div class="word-card" aria-live="polite">
          <div class="word-meta">
            <span id="grade-name">小学一年级</span>
            <span id="word-length">0 个字母</span>
          </div>
          <p id="word-display" class="word-display">cat</p>
          <p id="phonetic-display" class="phonetic">/kæt/</p>
          <p id="meaning-display" class="meaning">猫</p>
          <p id="example-display" class="example" hidden></p>
          <div class="audio-actions">
            <button id="speak-word-button" class="button primary" type="button">
              <span class="button-icon" aria-hidden="true">▶</span>
              听单词
            </button>
            <button id="speak-meaning-button" class="button secondary" type="button">
              <span class="button-icon" aria-hidden="true">中</span>
              听中文
            </button>
            <button id="spell-word-button" class="button ghost" type="button">
              <span class="button-icon" aria-hidden="true">A</span>
              字母接龙
            </button>
          </div>
        </div>

        <section class="answer-section" aria-labelledby="answer-title">
          <div class="section-heading">
            <h2 id="answer-title">摆出这个单词</h2>
            <button id="clear-button" class="text-button" type="button">重新摆</button>
          </div>
          <div id="letter-boxes" class="letter-boxes" role="group" aria-label="单词字母输入方格"></div>
          <input
            id="letter-input"
            class="letter-input"
            type="text"
            inputmode="latin"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="none"
            spellcheck="false"
            aria-label="输入英文单词字母"
          />
          <p id="feedback" class="feedback neutral" aria-live="assertive">听一听，再把字母放进格子里。</p>
        </section>

        <div class="bottom-actions">
          <button id="previous-button" class="button secondary" type="button">上一题</button>
          <button id="next-button" class="button primary" type="button">下一题</button>
        </div>
      </section>

      <aside class="status-panel" aria-label="练习进度">
        <div class="progress-card">
          <div class="progress-ring" aria-hidden="true">
            <span id="score-value">0</span>
          </div>
          <div>
            <p class="status-label">星星积分</p>
            <p id="score-text" class="status-value">0 / 30</p>
          </div>
        </div>
        <div class="mini-board">
          <div>
            <span class="mini-number" id="answered-count">0</span>
            <span class="mini-label">已完成</span>
          </div>
          <div>
            <span class="mini-number" id="remaining-count">30</span>
            <span class="mini-label">剩余</span>
          </div>
        </div>
        <div id="word-map" class="word-map" aria-label="本轮 30 个单词进度"></div>
        <div class="settings-card">
          <label class="field-label" for="grade-select">选择词库</label>
          <select id="grade-select" autocomplete="off"></select>
          <label class="field-label" for="word-audio-source-select">单词发音</label>
          <select id="word-audio-source-select" autocomplete="off">
            <option value="oxford">Oxford</option>
            <option value="youdao">有道</option>
          </select>
          <label class="toggle-row" for="show-word-toggle">
            <input id="show-word-toggle" type="checkbox" checked />
            <span>显示单词</span>
          </label>
          <label class="toggle-row" for="show-meaning-toggle">
            <input id="show-meaning-toggle" type="checkbox" checked />
            <span>显示释义</span>
          </label>
          <label class="toggle-row" for="auto-read-toggle">
            <input id="auto-read-toggle" type="checkbox" checked />
            <span>自动听单词</span>
          </label>
          <label class="toggle-row" for="ui-feedback-toggle">
            <input id="ui-feedback-toggle" type="checkbox" checked />
            <span>操作提示音</span>
          </label>
          <button id="new-round-button" class="button secondary" type="button">换一组</button>
        </div>
      </aside>
    </main>

    <footer class="site-footer">
      <p>
        本工具是一个免费的<strong>英语单词拼写练习</strong>网站，通过"听发音—摆字母—对照释义"的方式，
        帮助小学到初中阶段的学生巩固单词听写和拼写能力。词库按年级分组，支持中英文发音朗读、
        字母闯关模式和错题回顾，适合日常背单词打卡和课后听写作业。
      </p>
      <nav class="footer-links" aria-label="页脚">
        <a href="/about/">关于我们</a>
        <a href="/contact/">联系我们</a>
        <a href="/privacy/">隐私声明</a>
      </nav>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
